name: omp-watch-upstream

# Poll upstream, bump omp/versions.json when either project moves, and
# dispatch the build. The Unraid Docker tab then shows an ordinary update
# badge on the OMP app.
#
# omp is tracked via npm `latest` (it releases 2-3 times a day). Cody is not
# on npm, so it is tracked as the HEAD commit of nphil/cody main via the
# GitHub API. A bump that turns out bad is rolled back by editing
# versions.json to a known-good pair (the immutable ompX-codyY tag also
# stays on GHCR for that).

on:
  schedule:
    - cron: "42 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compare against upstream
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          cur_omp=$(jq -r .omp omp/versions.json)
          cur_cody=$(jq -r .cody omp/versions.json)
          new_omp=$(curl -fsS https://registry.npmjs.org/@oh-my-pi/pi-coding-agent/latest | jq -r .version)
          new_cody=$(gh api repos/nphil/cody/commits/main --jq .sha)
          echo "omp: $cur_omp -> $new_omp ; cody: $cur_cody -> $new_cody"
          if [ "$cur_omp" = "$new_omp" ] && [ "$cur_cody" = "$new_cody" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            jq -n --arg omp "$new_omp" --arg cody "$new_cody" '{"omp": $omp, "cody": $cody}' > omp/versions.json
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "msg=omp $cur_omp -> $new_omp, cody ${cur_cody:0:7} -> ${new_cody:0:7}" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit bump
        if: steps.check.outputs.changed == 'true'
        run: |
          git config user.name "omp-version-watch"
          git config user.email "actions@users.noreply.github.com"
          git add omp/versions.json
          git commit -m "Track upstream: ${{ steps.check.outputs.msg }}"
          git push

      # A push made with GITHUB_TOKEN does not fire other workflows'
      # push triggers (recursion guard), so dispatch the build directly.
      - name: Trigger build
        if: steps.check.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run omp-build.yml --ref main -R "$GITHUB_REPOSITORY"
