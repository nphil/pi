name: build-and-push

on:
  push:
    branches: [main]
    paths: [Dockerfile, entrypoint.sh, versions.json, .github/workflows/build.yml]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read pinned versions
        id: versions
        run: |
          echo "pi=$(jq -r .pi versions.json)" >> "$GITHUB_OUTPUT"
          echo "piweb=$(jq -r '.["pi-web"]' versions.json)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            PI_VERSION=${{ steps.versions.outputs.pi }}
            PI_WEB_VERSION=${{ steps.versions.outputs.piweb }}
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:pi${{ steps.versions.outputs.pi }}-web${{ steps.versions.outputs.piweb }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=pi coding agent + PI WEB browser client for Unraid
          cache-from: type=gha
          cache-to: type=gha,mode=max
